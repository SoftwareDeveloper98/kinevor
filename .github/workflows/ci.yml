name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  platform-backend:
    name: Platform backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinevor-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Kinevor.Platform.slnx
      - name: Build
        run: dotnet build Kinevor.Platform.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Kinevor.Platform.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack Kinevor.Platform.slnx -c Release --no-build -o artifacts/packages

  platform-web:
    name: Platform web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinevor-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kinevor-platform/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
