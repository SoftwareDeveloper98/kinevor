name: kinevor_staff_dashboard
description: Standalone Flutter staff dashboard, trend and alert inbox UI for Kinevor.
version: 0.1.0
publish_to: none
repository: https://github.com/SoftwareDeveloper98/kinevor-staff-dashboard
issue_tracker: https://github.com/SoftwareDeveloper98/kinevor-staff-dashboard/issues

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Sora-LICENSE.txt
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 400
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 500
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 600
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 700
        - asset: assets/fonts/Sora-Variable.ttf
          weight: 800
